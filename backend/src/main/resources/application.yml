server:
  port: 8080

spring:
  application:
    name: agent-eval-backend

  # ============ MySQL 数据源 ============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://114.66.28.183:49543/agent_eval?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: agent_eval
    password: agent_eval_%123

  # ============ Redis 配置 ============
  redis:
    host: 114.66.28.183
    port: 28369
    password: agent_eval_%123
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # ============ JPA 配置 ============
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ============ Jackson 配置 ============
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============ 对象存储配置 ============
# 本地文件系统（dev/test 模式），生产环境可切换为 MinIO / OSS / S3
storage:
  local:
    enabled: true
    base-dir: /tmp/agent-eval-storage

# ============ 异步线程池 ============
async:
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 50
    thread-name-prefix: agent-eval-

# ============ Agent CLI 配置 ============
# 部署时修改 command-template 为真实 CLI 命令
# 支持占位符: {prompt} {repo} {branch} {workDir} {caseName}
agent:
  cli:
    command-template: "echo '[THINK] 开始处理案例: {caseName}' && echo '[TOOL:cmd] 仓库: {repo} 分支: {branch}' && echo '[USER] {prompt}' && sleep 3 && echo '[AGENT] 案例 {caseName} 执行完成'"
    timeout-seconds: 1800
    work-dir-prefix: /tmp/agent-eval
    max-retries: 3

# ============ LLM 评分 API 配置（HTTP 方式，备用）============
# 如果评分也走 CLI，此项可忽略
scoring:
  # 评分 CLI 配置（与 Agent CLI 独立）
  cli:
    command-template: "echo '[THINK] 开始评分: {caseName}' && echo '[TOOL:cmd] 评分标准: {standardVersion}' && echo '[AGENT] 评分完成，案例 {caseName} 综合得分 85'"
    timeout-seconds: 300
    work-dir-prefix: /tmp/agent-eval/scoring
    max-retries: 2
  # 评分 LLM HTTP 配置（备用）
  llm:
    endpoint: "https://api.openai.com/v1/chat/completions"
    api-key: "${SCORING_API_KEY:your-api-key-here}"
    model: "gpt-4o"
    timeout-seconds: 120
    max-retries: 3

# ============ 日志 ============
logging:
  level:
    com.example.agenteval: DEBUG

minio:
  endpoint: http://agentevalminio.3q.hair
  access-key: agent_eval
  secret-key: agent_eval_%123
  bucket: eval