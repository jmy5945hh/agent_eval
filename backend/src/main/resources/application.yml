server:
  port: 8080

spring:
  application:
    name: agent-eval-backend

  # ============ MySQL 数据源 ============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://114.66.28.183:49543/agent_eval?useUnicode=true&characterEncoding=utf-8&useSSL=false&sslMode=DISABLED&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000
    username: agent_eval
    password: agent_eval_%123
    hikari:
      connection-timeout: 30000
      validation-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-test-query: SELECT 1

  # ============ Redis 配置 ============
  redis:
    host: 114.66.28.183
    port: 28369
    password: agent_eval_%123
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # ============ JPA 配置 ============
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ============ Jackson 配置 ============
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============ 对象存储配置 ============
# 本地文件系统（dev/test 模式），生产环境可切换为 MinIO / OSS / S3
storage:
  local:
    enabled: true
    base-dir: /tmp/agent-eval-storage

# ============ 异步线程池 ============
async:
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 50
    thread-name-prefix: agent-eval-

# ============ Agent CLI 配置 ============
# 部署时修改 command-template 为真实 CLI 命令
# 支持占位符: {prompt} {repo} {branch} {workDir} {caseName}
agent:
  cli:
    command-template: "echo '[THINK] 开始处理案例: {caseName}' && echo '[TOOL:cmd] 仓库: {repo} 分支: {branch}' && echo '[USER] {prompt}' && sleep 3 && echo '[AGENT] 案例 {caseName} 执行完成'"
    timeout-seconds: 1800
    work-dir-prefix: /tmp/agent-eval
    max-retries: 3

# ============ LLM 评分 API 配置（HTTP 方式，备用）============
# 如果评分也走 CLI，此项可忽略
scoring:
  # 评分 CLI 配置（与 Agent CLI 独立）
  cli:
    command-template: "echo '[THINK] 开始评分: {caseName}' && echo '[TOOL:cmd] 评分标准: {standardVersion}' && echo '[AGENT] 评分完成，案例 {caseName} 综合得分 85'"
    timeout-seconds: 300
    work-dir-prefix: /tmp/agent-eval/scoring
    max-retries: 2
  # 评分 LLM HTTP 配置（备用）
  llm:
    endpoint: "https://api.openai.com/v1/chat/completions"
    api-key: "${SCORING_API_KEY:your-api-key-here}"
    model: "gpt-4o"
    timeout-seconds: 120
    max-retries: 3

# ============ 日志 ============
logging:
  level:
    com.example.agenteval: DEBUG

minio:
  endpoint: http://agentevalminio.3q.hair
  access-key: agent_eval
  secret-key: agent_eval_%123
  bucket: eval

temp-file_path: d:/temp/


# Knife4j 配置
knife4j:
  enable: true
  # 生产环境屏蔽，设置为 true 可在生产环境关闭文档访问入口[reference:4]
  # production: false

# OpenAPI 相关信息配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

task-run-folder: d:/temp

eval-case-prompt: "你是一位专业的代码质量评测专家。现在，你需要对 AI 助手完成的任务进行客观、全面的评分。\n\n### 1. 任务描述\n<TaskDescription>\n\n### 2. 正确参考文件（作为基准）\n<CorrectReferenceDocument>\n\n### 3. AI 生成的文件（待评测）\n请执行以下操作：\n- 通过 git diff 以识别变更\n- 将读取到的每个文件内容与第 2 步中读取的基准文件进行逐项比较。\n\n### 4. 评分标准\n请按如下 JSON 数组格式定义评分维度（权重总和应为 100）：\n<ScoringCriteria>\n\n### 评测要求\n1. 评分维度与权重\n评分包含 多个维度，每个维度有两个属性：\nweight（权重）：该维度在总分中的最大分值（整数）。\nscore（得分）：你需给该维度打出的分数（整数）。\n所有维度的权重之和 = 100（即总分满分 100 分）。\n\n2. 打分约束（必须遵守）\n得分 ≤ 权重：每个维度的最终得分不得高于其权重（即满分不能超过权重）。\n得分必须为整数：不允许小数。\n总分为各维度得分之和，但由你按每个维度独立评分，无需额外计算总和（保证不超总分即可）。\n\n3. 评分流程（逐维度进行）\n逐一比较 AI 生成文件与正确参考文件，针对每个维度，评估 AI 的表现。\n基于该维度的权重，给出一个 0 到权重之间 的整数值作为得分。\n例如：某维度权重为 20，则得分只能在 0~20 之间，取整数。\n在评分时，需参考该维度的具体评判标准。\n\n4. 评语要求\n每个维度必须附带一句 简洁的评语，说明 得分理由 或 扣分原因（例如：符合格式要求、关键信息缺失、逻辑清晰等）。\n评语应简明扼要，直击要点。\n\n5. 最终输出格式\n必须输出一个 严格的 JSON 数组，数组中的每个对象包含以下字段：\n\njson\n{\n  \"key\": \"维度标识（如：dim1）\",\n  \"label\": \"维度名称（如：完整性）\",\n  \"weight\": 20,       // 整型权重\n  \"score\": 18,        // 整型得分（0 ≤ score ≤ weight）\n  \"comment\": \"评语文本\"\n}\n重要：\n输出仅包含该 JSON 数组，不要添加任何额外解释、前缀或后缀。\n确保 JSON 格式合法（键名带双引号，值类型正确）。\n\n\n### 输出格式（仅输出此 JSON 数组，不要包含其他任何内容）\n<OutputFormat>"