server:
  port: 8080

spring:
  application:
    name: agent-eval-backend

  # ============ MySQL 数据源 ============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://114.66.28.183:49543/agent_eval?useUnicode=true&characterEncoding=utf-8&useSSL=false&sslMode=DISABLED&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000
    username: agent_eval
    password: agent_eval_%123
    hikari:
      connection-timeout: 30000
      validation-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-test-query: SELECT 1

  # ============ Redis 配置 ============
  redis:
    host: 114.66.28.183
    port: 28369
    password: agent_eval_%123
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # ============ JPA 配置 ============
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ============ Jackson 配置 ============
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============ 对象存储配置 ============
# 本地文件系统（dev/test 模式），生产环境可切换为 MinIO / OSS / S3
storage:
  local:
    enabled: true
    base-dir: /tmp/agent-eval-storage

# ============ 异步线程池 ============
async:
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 50
    thread-name-prefix: agent-eval-

# ============ Agent CLI 配置 ============
# 部署时修改 command-template 为真实 CLI 命令
# 支持占位符: {prompt} {repo} {branch} {workDir} {caseName}
agent:
  cli:
    command-template: "echo '[THINK] 开始处理案例: {caseName}' && echo '[TOOL:cmd] 仓库: {repo} 分支: {branch}' && echo '[USER] {prompt}' && sleep 3 && echo '[AGENT] 案例 {caseName} 执行完成'"
    timeout-seconds: 1800
    work-dir-prefix: /tmp/agent-eval
    max-retries: 3

# ============ LLM 评分 API 配置（HTTP 方式，备用）============
# 如果评分也走 CLI，此项可忽略
scoring:
  # 评分 CLI 配置（与 Agent CLI 独立）
  cli:
    command-template: "echo '[THINK] 开始评分: {caseName}' && echo '[TOOL:cmd] 评分标准: {standardVersion}' && echo '[AGENT] 评分完成，案例 {caseName} 综合得分 85'"
    timeout-seconds: 300
    work-dir-prefix: /tmp/agent-eval/scoring
    max-retries: 2
  # 评分 LLM HTTP 配置（备用）
  llm:
    endpoint: "https://api.openai.com/v1/chat/completions"
    api-key: "${SCORING_API_KEY:your-api-key-here}"
    model: "gpt-4o"
    timeout-seconds: 120
    max-retries: 3

# ============ 日志 ============
logging:
  level:
    com.example.agenteval: DEBUG

minio:
  endpoint: http://agentevalminio.3q.hair
  access-key: agent_eval
  secret-key: agent_eval_%123
  bucket: eval

temp-file_path: ./temp/


# Knife4j 配置
knife4j:
  enable: true
  # 生产环境屏蔽，设置为 true 可在生产环境关闭文档访问入口[reference:4]
  # production: false

# OpenAPI 相关信息配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

task-run-folder: d:/temp

eval-case-prompt: "你是一位专业的代码质量评测专家。现在，你需要对 AI 助手完成的任务进行客观、全面的评分。\n\n### 1. 任务描述\n<TaskDescription>\n\n### 2. 正确参考文件（作为基准）\n<CorrectReferenceDocument>\n\n### 3. AI 生成的文件（待评测）\n请执行以下操作：\n- 通过 git diff 以识别变更\n- 将读取到的每个文件内容与第 2 步中读取的基准文件进行逐项比较。\n\n### 4. 评分标准\n请按如下 JSON 数组格式定义评分维度（权重总和应为 100，可调整）：\n<ScoringCriteria>\n\n### 评测要求\n- 逐一比较 AI 生成的文件与正确参考文件，从每个维度进行打分（百分制，如 85 分）。\n- 针对每个维度，给出简洁的评语（说明得失分理由）。\n- 最终输出必须是一个严格的 JSON 数组，数组中的每个对象包含 `key`、`label`、`weight`、`score` 字段，其中 `score` 字段填写“得分”（例如：90）。\n- comment字段是对整体结果的一个评语，比如：代码逻辑完全正确，但缺少边界处理\n\n### 输出格式（仅输出此 JSON 数组，不要包含其他任何内容）\n<OutputFormat>"